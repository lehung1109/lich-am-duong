<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Vietnamese Lacquer Red -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="45%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Golden Gradients for Solar / Lunar elements -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="goldMoon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Drop Shadow for Dimensionality -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#300505" flood-opacity="0.6" />
    </filter>
    
    <!-- Mask for smooth Crescent Moon -->
    <mask id="crescentMask">
      <rect width="512" height="512" fill="black" />
      <circle cx="230" cy="256" r="145" fill="white" />
      <circle cx="285" cy="235" r="120" fill="black" />
    </mask>
  </defs>

  <!-- Red Squircle Base -->
  <rect width="512" height="512" rx="116" ry="116" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" ry="96" fill="none" stroke="#fef08a" stroke-width="4" stroke-opacity="0.3" />

  <g filter="url(#dropShadow)">
    <!-- 1. SUN RAYS (Dương) centered around (315, 230) -->
    <g fill="url(#goldLight)">
      <!-- Top -->
      <polygon points="315,105 325,145 305,145" />
      <!-- Top-Right -->
      <polygon points="403,142 387,175 373,161" />
      <!-- Right -->
      <polygon points="440,230 400,240 400,220" />
      <!-- Bottom-Right -->
      <polygon points="403,318 373,299 387,285" />
      <!-- Bottom -->
      <polygon points="315,355 305,315 325,315" />
      <!-- Bottom-Left (behind moon) -->
      <polygon points="227,318 257,299 243,285" />
      <!-- Top-Left (behind moon) -->
      <polygon points="227,142 243,175 257,161" />
    </g>

    <!-- 2. SUN CORE DISK -->
    <circle cx="315" cy="230" r="62" fill="url(#goldLight)" />

    <!-- 3. CRESCENT MOON (Âm) embracing from the left -->
    <rect width="512" height="512" fill="url(#goldMoon)" mask="url(#crescentMask)" />

    <!-- Sparkle Stars -->
    <polygon points="145,155 149,167 161,171 149,175 145,187 141,175 129,171 141,167" fill="#ffffff" opacity="0.9" />
    <polygon points="375,370 378,379 387,382 378,385 375,394 372,385 363,382 372,379" fill="#fef08a" opacity="0.8" />
  </g>
</svg>